name: Build Duck Hunt Retro APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The repository is intentionally kept to two files:
      # Actions.yml and DuckHuntRetro.zip. Extract the game project here.
      - name: Extract game project archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 2 -type f -iname 'DuckHuntRetro.zip' -print -quit)"
          if [[ -z "$archive" ]]; then
            echo "::error::DuckHuntRetro.zip was not found. Upload it beside the workflow file."
            exit 1
          fi
          unzip -oq "$archive" -d "$RUNNER_TEMP/duckhunt-project"
          project="$(find "$RUNNER_TEMP/duckhunt-project" -type f -name 'gradlew' -print -quit)"
          if [[ -z "$project" ]]; then
            echo "::error::The game archive does not contain gradlew."
            exit 1
          fi
          project_dir="$(dirname "$project")"
          cp -a "$project_dir"/. .
          test -f ./gradlew
          test -f ./app/build.gradle || test -f ./app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Gradle cache is intentionally disabled: the game files are
          # extracted from DuckHuntRetro.zip and aren't present at checkout time.

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Make Gradle launcher executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Copy APK to artifact name
        run: cp app/build/outputs/apk/debug/app-debug.apk duck-hunt-retro-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: duck-hunt-retro-debug-apk
          path: duck-hunt-retro-debug.apk
          if-no-files-found: error
          retention-days: 14
