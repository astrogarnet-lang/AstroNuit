name: Build Duck Hunt Retro APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Make Gradle launcher executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk duck-hunt-retro-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: duck-hunt-retro-debug-apk
          path: duck-hunt-retro-debug.apk
          if-no-files-found: error
          retention-days: 14
