name: Build Duck Hunt Retro APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK from DuckHuntRetro.zip
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Extract first so setup-java's Gradle cache can see the wrapper and build files.
      - name: Extract game archive into workspace
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name 'DuckHuntRetro.zip' -print -quit)"
          if [[ -z "$archive" ]]; then
            echo "::error::DuckHuntRetro.zip was not found in the repository root."
            exit 1
          fi

          extract_dir="$RUNNER_TEMP/duckhunt-source"
          mkdir -p "$extract_dir"
          unzip -q "$archive" -d "$extract_dir"

          gradlew_path="$(find "$extract_dir" -type f -name 'gradlew' -print -quit)"
          if [[ -z "$gradlew_path" ]]; then
            echo "::error::The ZIP does not contain the game's gradlew script."
            exit 1
          fi

          project_dir="${gradlew_path%/gradlew}"
          cp -a "$project_dir"/. "$GITHUB_WORKSPACE"/

          test -f "$GITHUB_WORKSPACE/gradlew"
          test -f "$GITHUB_WORKSPACE/settings.gradle"
          test -f "$GITHUB_WORKSPACE/app/build.gradle"
          if [[ -d "$GITHUB_WORKSPACE/.github/workflows" ]]; then
            echo "The ZIP must not replace repository workflows; leaving the installed Actions workflow untouched."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Make Gradle launcher executable
        run: chmod +x ./gradlew

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Rename APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk duck-hunt-retro-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: duck-hunt-retro-debug-apk
          path: duck-hunt-retro-debug.apk
          if-no-files-found: error
          retention-days: 14
