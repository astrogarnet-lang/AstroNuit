name: Build Starwalk (Android)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source and detect Android build system
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail
          ARCHIVE='.github/source.zip'
          test -f "$ARCHIVE" || { echo 'Required archive .github/source.zip was not found.' >&2; exit 1; }
          SRC="$RUNNER_TEMP/starwalk-source"
          rm -rf "$SRC"
          mkdir -p "$SRC"
          unzip -t "$ARCHIVE"
          unzip -q "$ARCHIVE" -d "$SRC"

          FLUTTER_MANIFEST="$(find "$SRC" -type f -name pubspec.yaml -not -path '*/.dart_tool/*' -not -path '*/build/*' -print -quit || true)"
          if [[ -n "$FLUTTER_MANIFEST" ]]; then
            ROOT="$(dirname "$FLUTTER_MANIFEST")"
            PROJECT_TYPE='flutter'
            echo "project_type=$PROJECT_TYPE" >> "$GITHUB_OUTPUT"
          else
            WRAPPER="$(find "$SRC" -type f -name gradlew -not -path '*/.gradle/*' -print -quit || true)"
            if [[ -z "$WRAPPER" ]]; then
              echo 'No pubspec.yaml (Flutter) or gradlew (Gradle) was found in source.zip.' >&2
              exit 1
            fi
            ROOT="$(dirname "$WRAPPER")"
            PROJECT_TYPE='gradle'
            echo "project_type=$PROJECT_TYPE" >> "$GITHUB_OUTPUT"
          fi
          echo "source_root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Detected project type for Starwalk: $PROJECT_TYPE"

      - name: Set up Flutter
        if: steps.detect.outputs.project_type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter APK
        if: steps.detect.outputs.project_type == 'flutter'
        shell: bash
        env:
          SOURCE_ROOT: ${{ steps.detect.outputs.source_root }}
        run: |
          set -Eeuo pipefail
          cd "$SOURCE_ROOT"
          flutter pub get
          flutter build apk --release

      - name: Build Gradle APK
        if: steps.detect.outputs.project_type == 'gradle'
        shell: bash
        env:
          SOURCE_ROOT: ${{ steps.detect.outputs.source_root }}
        run: |
          set -Eeuo pipefail
          cd "$SOURCE_ROOT"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK artifacts
        if: success()
        shell: bash
        env:
          SOURCE_ROOT: ${{ steps.detect.outputs.source_root }}
        run: |
          set -Eeuo pipefail
          DEST="$RUNNER_TEMP/starwalk-artifacts"
          mkdir -p "$DEST"
          count=0
          while IFS= read -r -d '' apk; do
            name="$(basename "$apk")"
            target="$DEST/$name"
            if [[ -e "$target" ]]; then
              target="$DEST/${{ github.run_number }}-$count-$name"
            fi
            cp "$apk" "$target"
            count=$((count + 1))
          done < <(find "$SOURCE_ROOT" -type f -name '*.apk' -not -path '*/.gradle/*' -print0)
          if [[ "$count" -eq 0 ]]; then
            echo 'Build completed but no APK was produced.' >&2
            exit 1
          fi
          echo "Collected $count APK file(s)."

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: starwalk-android-${{ github.run_number }}
          path: ${{ runner.temp }}/starwalk-artifacts/*.apk
          if-no-files-found: error

      - name: Cleanup repository safely (keep .github only)
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${TARGET_BRANCH}" ]]; then
            echo "Could not determine the branch to clean." >&2
            exit 1
          fi
          if [[ ! -d .github ]]; then
            echo "The .github directory is missing; refusing destructive cleanup." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild the cleanup commit from the newest remote tip on every try.
          # This avoids pushing a stale parent after another run updates the branch.
          for attempt in {1..8}; do
            echo "Cleanup push attempt ${attempt}/8"
            if ! git fetch origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"; then
              sleep $((attempt * 2))
              continue
            fi
            if ! git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"; then
              sleep $((attempt * 2))
              continue
            fi

            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf -- {} +

            git add -A
            if git diff --cached --quiet; then
              echo "Repository already contains only .github; no cleanup commit needed."
              exit 0
            fi

            git commit -m "chore: retain workflow and source archive only [skip ci]"
            if git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
              echo "Cleanup committed successfully."
              exit 0
            fi
            echo "Push was rejected (likely a concurrent update); refreshing and retrying." >&2
            sleep $((attempt * 2))
          done
          echo "Cleanup could not be pushed after 8 attempts. Check branch protection and Actions write permissions." >&2
          exit 1
