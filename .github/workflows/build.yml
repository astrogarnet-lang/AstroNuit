name: Starwalk — Android APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-cleanup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build offline-capable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35 packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract project source ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f source.zip ]]; then ARCHIVE=source.zip; elif [[ -f .github/source.zip ]]; then ARCHIVE=.github/source.zip; else echo 'source.zip is missing' >&2; exit 1; fi
          mkdir -p src
          unzip -q "$ARCHIVE" -d src
      - name: Static JavaScript and JSON audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, pathlib, re
          root = pathlib.Path('src/app/src/main/assets')
          for p in root.rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          html = (root / 'index.html').read_text(encoding='utf-8')
          blocks = []
          for attrs, code in re.findall(r'<script\b([^>]*)>(.*?)</script>', html, re.I | re.S):
              if re.search(r'type\s*=\s*["\']application/json["\']', attrs, re.I):
                  continue
              if re.search(r'\bsrc\s*=', attrs, re.I):
                  continue
              if code.strip():
                  blocks.append(code)
          if not blocks:
              raise SystemExit('No inline JavaScript found')
          pathlib.Path('ci-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          PYCODE
          node --check ci-inline.js
      - name: Validate Android manifest
        shell: bash
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('src/app/src/main/AndroidManifest.xml')"
      - name: Download optional NASA offline assets and merge local catalogue
        shell: bash
        run: |
          set -euo pipefail
          cd src
          chmod +x download_official_assets.sh
          ./download_official_assets.sh
          python3 prepare_catalog.py
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd src
          gradle --no-daemon :app:assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Starwalk-debug.apk
          cp README_RU.md ../dist/README_RU.md
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starwalk-Android-APK
          path: dist/*
          if-no-files-found: error
  cleanup:
    name: Retain only .github (concurrency-safe)
    needs: build
    if: ${{ always() && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Keep workflow and source archive; retry concurrent pushes
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild the cleanup commit from the latest remote tip on every
          # attempt. If another run has already cleaned the branch, this exits
          # successfully without trying to push a duplicate commit.
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Cleanup/push attempt ${attempt}/8"

            git fetch --no-tags origin \
              "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
            git reset --hard "refs/remotes/origin/${TARGET_BRANCH}"

            mkdir -p .github
            if [[ -f source.zip ]]; then
              install -m 0644 source.zip .github/source.zip
            elif [[ -f .github/source.zip ]]; then
              echo "Using previously preserved .github/source.zip"
            else
              echo "ERROR: source.zip is missing; cannot preserve build input." >&2
              exit 1
            fi

            if [[ ! -f .github/workflows/build.yml ]]; then
              echo "ERROR: .github/workflows/build.yml is missing." >&2
              exit 1
            fi
            unzip -tq .github/source.zip >/dev/null

            # Keep only .github in the repository working tree.
            find . -mindepth 1 -maxdepth 1 \
              ! -name .github ! -name .git \
              -exec rm -rf -- {} +

            git add -A
            if git diff --cached --quiet; then
              echo "Repository already contains only .github; no push needed."
              exit 0
            fi

            git commit -m "chore: retain workflow and source archive only [skip ci]"

            if git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
              echo "Cleanup commit pushed successfully."
              exit 0
            fi

            echo "Remote branch moved during push; refreshing and retrying." >&2
            sleep "$((attempt * 2))"
          done

          echo "ERROR: Could not push cleanup after 8 attempts." >&2
          exit 1
