name: AstroNuit AI - Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'AstroNuit-AI-Android-Foundation-0.2.4.zip'
      - '.github/workflows/astronuit-ai-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project archive
        run: |
          test -f AstroNuit-AI-Android-Foundation-0.2.4.zip
          unzip -t AstroNuit-AI-Android-Foundation-0.2.4.zip

      - name: Extract Flutter source
        run: |
          rm -rf "$RUNNER_TEMP/astronuit-source"
          mkdir -p "$RUNNER_TEMP/astronuit-source"
          unzip -q AstroNuit-AI-Android-Foundation-0.2.4.zip -d "$RUNNER_TEMP/astronuit-source"
          test -f "$RUNNER_TEMP/astronuit-source/pubspec.yaml"
          test -f "$RUNNER_TEMP/astronuit-source/tool/bootstrap_android.sh"

      - name: Resolve dependencies
        working-directory: ${{ runner.temp }}/astronuit-source
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: ${{ runner.temp }}/astronuit-source
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: ${{ runner.temp }}/astronuit-source
        run: flutter test --no-pub

      - name: Prepare Android project
        working-directory: ${{ runner.temp }}/astronuit-source
        run: bash tool/bootstrap_android.sh

      - name: Build release APK
        working-directory: ${{ runner.temp }}/astronuit-source
        run: flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: astronuit-android-apk
          path: ${{ runner.temp }}/astronuit-source/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
