name: AstroNuit AI - Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'AstroNuit-AI-Android-Foundation-0.2.4.zip'
      - '.github/workflows/astronuit-ai-build.yml'

permissions:
  contents: write

jobs:
  build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          # No Gradle cache here: the repository contains only the source ZIP.
          # The Android/Gradle project is generated later by bootstrap_android.sh.

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project archive
        run: |
          test -f AstroNuit-AI-Android-Foundation-0.2.4.zip
          unzip -t AstroNuit-AI-Android-Foundation-0.2.4.zip

      - name: Extract Flutter source
        run: |
          rm -rf "$RUNNER_TEMP/astronuit-source"
          mkdir -p "$RUNNER_TEMP/astronuit-source"
          unzip -q AstroNuit-AI-Android-Foundation-0.2.4.zip -d "$RUNNER_TEMP/astronuit-source"
          test -f "$RUNNER_TEMP/astronuit-source/pubspec.yaml"
          test -f "$RUNNER_TEMP/astronuit-source/tool/bootstrap_android.sh"

      - name: Resolve dependencies
        working-directory: ${{ runner.temp }}/astronuit-source
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: ${{ runner.temp }}/astronuit-source
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: ${{ runner.temp }}/astronuit-source
        run: flutter test --no-pub

      - name: Prepare Android project
        working-directory: ${{ runner.temp }}/astronuit-source
        run: bash tool/bootstrap_android.sh

      - name: Build release APK
        working-directory: ${{ runner.temp }}/astronuit-source
        run: flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: astronuit-android-apk
          path: ${{ runner.temp }}/astronuit-source/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean repository (always, keep only .github)
        if: always() && steps.checkout.outcome == 'success'
        env:
          TARGET_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Remove every repository item at the root except Git metadata and .github.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf -- {} +

          # Remove extracted build sources from the runner's temporary directory too.
          rm -rf "$RUNNER_TEMP/astronuit-source"

          git add -A
          if git diff --cached --quiet; then
            echo "Repository already contains only .github; no cleanup commit needed."
          else
            git commit -m "chore: clean repository after AstroNuit build"
            if [[ "$TARGET_REF" == refs/heads/* ]]; then
              git push origin "HEAD:${TARGET_REF}"
            else
              echo "::warning::Cleanup was committed locally but not pushed: workflow ref is not a branch ($TARGET_REF)."
            fi
          fi
