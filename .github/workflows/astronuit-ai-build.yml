name: AstroNuit AI - Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'AstroNuit-AI-Android-Foundation-*.zip'
      - '.github/workflows/astronuit-ai-build.yml'

permissions:
  contents: read

concurrency:
  group: astronuit-ai-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate AstroNuit source archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(AstroNuit-AI-Android-Foundation-*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No AstroNuit-AI-Android-Foundation-*.zip found in repository root."
            exit 1
          fi
          selected="$(printf '%s\n' "${files[@]}" | sort -V | tail -n 1)"
          echo "zip=$selected" >> "$GITHUB_OUTPUT"
          echo "Using newest versioned source archive: $selected"

      - name: Extract AstroNuit source archive
        id: source
        shell: bash
        env:
          SOURCE_ARCHIVE: ${{ steps.archive.outputs.zip }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/astronuit-source"
          rm -rf "$work"
          mkdir -p "$work"
          unzip -oq "$SOURCE_ARCHIVE" -d "$work"
          shopt -s dotglob nullglob
          entries=("$work"/*)
          if [[ ${#entries[@]} -eq 1 && -d "${entries[0]}" ]]; then
            work="${entries[0]}"
          fi
          test -f "$work/pubspec.yaml" || { echo '::error::pubspec.yaml missing from source archive'; exit 1; }
          test -f "$work/tool/bootstrap_android.sh" || { echo '::error::tool/bootstrap_android.sh missing'; exit 1; }
          echo "directory=$work" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # No Gradle cache: Gradle files are generated only after archive extraction.

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffold
        working-directory: ${{ steps.source.outputs.directory }}
        run: bash tool/bootstrap_android.sh

      - name: Resolve Flutter dependencies
        working-directory: ${{ steps.source.outputs.directory }}
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: ${{ steps.source.outputs.directory }}
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: ${{ steps.source.outputs.directory }}
        run: flutter test --no-pub

      - name: Build release APK
        working-directory: ${{ steps.source.outputs.directory }}
        timeout-minutes: 55
        run: flutter build apk --release --no-pub

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: astronuit-android-apk
          path: ${{ steps.source.outputs.directory }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean generated workspace (always, on success or failure)
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf "$RUNNER_TEMP/astronuit-source"
          # Remove any untracked build residue from the ephemeral checkout.
          git clean -ffdx -e .github -e .github/**
          exit 0
