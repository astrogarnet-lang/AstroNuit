name: Build AstroNuit Android

# Single workflow for the project. Safe alongside other workflows:
# - unique name / job id
# - only reacts to this foundation archive and workflow file
# - paths-ignore keeps docs-only commits from rebuilding
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'AstroNuit-AI-Android-Foundation-*.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate AstroNuit source archive
        id: archive
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(AstroNuit-AI-Android-Foundation-*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No AstroNuit-AI-Android-Foundation-*.zip found in repo root."
            exit 1
          fi
          if [[ ${#files[@]} -gt 1 ]]; then
            echo "Multiple foundation archives found; using the last sorted name."
            IFS=$'\n' files=($(printf '%s\n' "${files[@]}" | sort))
          fi
          echo "Using archive: ${files[-1]}"
          echo "zip=${files[-1]}" >> "$GITHUB_OUTPUT"

      - name: Unpack AstroNuit source archive
        run: |
          unzip -oq "${{ steps.archive.outputs.zip }}" -d .

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffold
        run: bash tool/bootstrap_android.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Analyze source
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Build Android APK
        timeout-minutes: 55
        run: flutter build apk --release --no-pub

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: astronuit-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
