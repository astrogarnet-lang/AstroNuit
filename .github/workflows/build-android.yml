name: Build AstroNuit Android 0.1.4

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build-android:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Unpack AstroNuit source archive
        run: |
          test -f AstroNuit-AI-Android-Foundation-0.1.4.zip
          unzip -oq AstroNuit-AI-Android-Foundation-0.1.4.zip -d .

      - name: Set up Flutter stable
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
          cache-sdk: true

      - name: Generate Android platform scaffold
        run: bash tool/bootstrap_android.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Analyze source
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Build Android APK
        timeout-minutes: 55
        run: flutter build apk --release --no-pub

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: astronuit-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
