name: AstroNuit Firewall — Windows Portable
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build WPF portable package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Extract project source ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = if (Test-Path 'source.zip') { 'source.zip' } elseif (Test-Path '.github/source.zip') { '.github/source.zip' } else { throw 'source.zip is missing' }
          Expand-Archive -Path $archive -DestinationPath 'src' -Force
      - name: Build AstroNuit Firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Get-ChildItem 'src' -Recurse -Filter 'AstroNuitFirewall.csproj' | Select-Object -First 1
          if (!$project) { throw 'AstroNuitFirewall.csproj not found in source.zip' }
          msbuild $project.FullName /m /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package portable output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem 'src' -Recurse -Filter 'AstroNuitFirewall.exe' | Where-Object { $_.FullName -match '[\\/]bin[\\/]Release[\\/]' } | Select-Object -First 1
          if (!$exe) { throw 'Build completed without AstroNuitFirewall.exe under bin/Release' }
          New-Item -ItemType Directory -Force -Path 'dist/package' | Out-Null
          Copy-Item -Path (Join-Path $exe.DirectoryName '*') -Destination 'dist/package' -Recurse -Force
          $readme = Get-ChildItem 'src' -Recurse -Filter 'README_RU.txt' | Select-Object -First 1
          if ($readme) { Copy-Item $readme.FullName 'dist/package/README_RU.txt' -Force }
          Compress-Archive -Path 'dist/package/*' -DestinationPath 'dist/AstroNuitFirewall-Windows-Portable.zip' -Force
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstroNuitFirewall-Windows-Portable
          path: dist/AstroNuitFirewall-Windows-Portable.zip
          if-no-files-found: error
  cleanup:
    name: Keep only .github after build (also on failure)
    needs: build
    if: ${{ always() && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Preserve source ZIP inside .github and clean repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          if [[ -f source.zip ]]; then
            cp source.zip .github/source.zip
          elif [[ -f .github/source.zip ]]; then
            echo 'Using previously preserved .github/source.zip'
          else
            echo 'ERROR: source.zip is missing; cannot preserve repeatable build input.' >&2
            exit 1
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .github ! -name .git -exec rm -rf -- {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: retain workflow and source archive only [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'Repository already contains only .github.'
          fi
